.home-container {

}

.post-card {
    background:#1c1c1c;
    border-radius:10px;
    overflow:hidden;
    text-align:center;
    transition:0.2s;
}

}

    width:100%;
    height:auto;
    display:block;
}

.post-card button {

    border:none;

    font-weight:bold;
    cursor:pointer;
}

.open-btn {

}

.copy-btn {

}

}

.pagination {

}

.page-btn, .page-num {
    padding:8px 12px;
    border:1px solid #00ff88;
    color:#00ff88;
    text-decoration:none;
    border-radius:4px;
}

.page-num.active {
    background:#00ff88;
    color:#000;
    font-weight:bold;
}
</style>
