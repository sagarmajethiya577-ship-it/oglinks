body {

}

.home-container {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(160px,1fr));
    gap:12px;
    padding:12px;
}

.post-card {
    background:#1c1c1c;
    border-radius:10px;
    overflow:hidden;
    text-align:center;
    transition:0.2s;
}

.post-card:hover {
    transform:scale(1.03);
}

.post-card img {
    width:100%;
    height:auto;
    display:block;
}

.post-card button {
    width:90%;
    margin:6px;
    padding:8px;
    border:none;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}

.open-btn {
    background:#007bff;
    color:white;
}

.open-btn:hover {
    background:#0056b3;
}

.copy-btn {
    background:#00ff88;
    color:#000;
}

.copy-btn:hover {
    background:#00cc6a;
}

.pagination {
    display:flex;
    justify-content:center;
    gap:5px;
    margin:25px;
    flex-wrap:wrap;
}

.page-btn, .page-num {
    padding:8px 12px;
    border:1px solid #00ff88;
    color:#00ff88;
    text-decoration:none;
    border-radius:4px;
}

.page-num.active {
    background:#00ff88;
    color:#000;
    font-weight:bold;
}
</style>
