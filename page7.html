.home-container {

}

.post-card {
    background:#1c1c1c;
    border-radius:10px;
    overflow:hidden;
    text-align:center;
    transition:0.2s;
}

}

.post-card img {
    width:100%;
    height:auto;
    display:block;
}

    width:90%;

    padding:8px;
    border:none;
    border-radius:6px;
    font-weight:bold;

}

.open-btn {

}

.copy-btn {

}

}

.pagination {

    flex-wrap:wrap;
}

.page-btn, .page-num {
    padding:8px 12px;
    border:1px solid #00ff88;
    color:#00ff88;
    text-decoration:none;
    border-radius:4px;
}

.page-num.active {

    color:#000;
    font-weight:bold;
}
</style>
