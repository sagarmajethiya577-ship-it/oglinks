.home-container {

}

.post-card {
    background:#1c1c1c;
    border-radius:10px;

}

}

}

.copy-btn {

}

}

.pagination {

}

.page-btn, .page-num {
    padding:8px 12px;
    border:1px solid #00ff88;
    color:#00ff88;
    text-decoration:none;
    border-radius:4px;
}

.page-num.active {

}
</style>
